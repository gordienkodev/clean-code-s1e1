<!doctype html>
<html>
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link
      rel="stylesheet"
      href="style.css"
      type="text/css"
      media="screen"
      charset="utf-8"
    />
  </head>
  <body>
    <div class="page-header">
      <img src="./eisenhower-matrix.jpg" /><a
        class="details-link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details&quest;</a
      >
    </div>
    <div class="todo-container">
      <div id="add-task-section">
        <label for="new-task">Add Item</label>
        <div class="task-row-wrapper">
          <input id="new-task" class="task" type="text" /><button>Add</button>
        </div>
      </div>
      <h3>Todo</h3>
      <ul id="incompleteTasks">
        <li>
          <input type="checkbox" /><label class="task">Pay Bills</label
          ><input type="text" class="task" /><button class="edit">Edit</button
          ><button class="delete" aria-label="Delete task">
            <img src="./remove.svg" alt="" />
          </button>
        </li>
        <li class="editMode">
          <input type="checkbox" /><label class="task">Go Shopping</label
          ><input type="text" value="Go Shopping" class="task" /><button
            class="edit"
          >
            Save</button
          ><button class="delete" aria-label="Delete task">
            <img src="./remove.svg" alt="" />
          </button>
        </li>
      </ul>
      <h3>Completed</h3>
      <ul id="completed-tasks">
        <li>
          <input type="checkbox" checked /><label class="task"
            >See the Doctor</label
          ><input type="text" class="task" /><button class="edit">Edit</button
          ><button class="delete" aria-label="Delete task">
            <img src="./remove.svg" alt="" />
          </button>
        </li>
      </ul>
    </div>
    <script type="text/javascript" src="app.js"></script>
  </body>
</html>
